<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}} · Oil Static Measure</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0E5E5B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E5E5B'/%3E%3Cpath d='M9 7h14v18H9z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M9 17h14' stroke='%234FC3B5' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#ECEFED;--surface:#FAFBFA;--ink:#12201D;--muted:#566762;--line:#CAD3CF;--accent:#0E5E5B;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1513;--surface:#15201D;--ink:#E4EDE9;--muted:#93A59F;--line:#2C3C38;--accent:#4FC3B5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1513;--surface:#15201D;--ink:#E4EDE9;--muted:#93A59F;--line:#2C3C38;--accent:#4FC3B5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink);text-decoration:none}
nav{display:flex;gap:16px;font-size:14px;flex-wrap:wrap}nav a{color:var(--muted);text-decoration:none}nav a:hover,nav a[aria-current]{color:var(--ink)}
main{padding:32px 0 40px}
h1{font:700 clamp(32px,5vw,44px)/1.05 var(--f-display);text-transform:uppercase;margin:0 0 6px;text-wrap:balance}
h2{font:700 24px/1.15 var(--f-display);text-transform:uppercase;margin:34px 0 8px}
h3{font-size:17px;margin:20px 0 6px}
.upd{color:var(--muted);font-size:14px;margin:0 0 22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:18px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
li{margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:20px 0 36px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="/producto">Oil Static Measure</a>
    <nav aria-label="Documentos legales"><a href="/terminos">Términos</a><a href="/privacidad">Datos personales</a><a href="/cookies">Cookies</a><a href="/pqrs">PQRS</a><a href="/">Ingresar</a></nav></header>
  <main>
{{content}}
  </main>
  <footer><span>© 2026 Juan Cohen. Todos los derechos reservados.</span><a href="/terminos">Términos y condiciones</a><a href="/privacidad">Política de tratamiento de datos personales</a><a href="/cookies">Política de cookies</a><a href="/pqrs">PQRS y habeas data</a></footer>
</div>
</body>
</html>
