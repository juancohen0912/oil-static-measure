<script>/* ===== OilStatic engine — API MPMS 3 / 11.1 / 12.1.1 / 12.1.1 prorrateo =====
 * Aritmética: todo redondeo es "half-up" decimal (sin error binario) y las
 * sumas/conciliaciones se hacen en enteros escalados (centésimas de barril).
 */
(function (root) {
  const E = {};
  // Redondeo decimal half-up robusto (API MPMS 12.1.1 §12.1.1.? reglas de redondeo por paso)
  E.round = function (x, n) {
    if (x === null || x === undefined || !isFinite(x)) return NaN;
    const shift = (v, k) => { const p = String(v).split('e'); return Number(p[0] + 'e' + ((p[1] ? Number(p[1]) : 0) + k)); };
    const s = Number(Number(x).toPrecision(15));
    const sign = s < 0 ? -1 : 1;
    const r = Math.round(shift(Math.abs(s), n));
    return sign * shift(r, -n) || 0;
  };
  const R = E.round;
  const cents = (x) => Math.round(Number(x.toPrecision ? x.toPrecision(15) : x) * 100); // entero (1/100 bbl)
  E.cents = cents;

  // --- API MPMS 3 (§3.1A): regla de 3 lecturas de nivel ---
  // Si las dos primeras coinciden se acepta; si no, si 2ª y 3ª coinciden se acepta; si no, promedio. Entero mm.
  E.levelFromReadings = function (a) {
    const v = a.filter((x) => x !== null && x !== '' && !isNaN(x)).map(Number);
    if (!v.length) return NaN;
    if (v.length === 1) return Math.round(v[0]);
    if (v[0] === v[1]) return Math.round(v[0]);
    if (v.length > 2 && v[1] === v[2]) return Math.round(v[1]);
    return R(v.reduce((s, x) => s + x, 0) / v.length, 0);
  };
  // --- API MPMS 7 / 3: temperatura promedio, 1 decimal °F ---
  E.tempFromReadings = function (a) {
    const v = a.filter((x) => x !== null && x !== '' && !isNaN(x)).map(Number);
    if (!v.length) return NaN;
    return R(v.reduce((s, x) => s + x, 0) / v.length, 1);
  };

  // --- Interpolación en tabla de aforo (nivel mm -> bbl). Puntos exactos devuelven el valor de tabla. ---
  E.tov = function (table, levelMm) {
    if (!table || !table.length) throw new Error('Tabla de aforo vacía');
    const t = table; // ordenada asc por nivel
    if (levelMm < t[0][0] || levelMm > t[t.length - 1][0])
      throw new Error('Nivel ' + levelMm + ' mm fuera del rango de la tabla de aforo (' + t[0][0] + '–' + t[t.length - 1][0] + ' mm)');
    let lo = 0, hi = t.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (t[m][0] <= levelMm) lo = m; else hi = m; }
    if (t[lo][0] === levelMm) return t[lo][1];
    if (t[hi][0] === levelMm) return t[hi][1];
    const f = (levelMm - t[lo][0]) / (t[hi][0] - t[lo][0]);
    return t[lo][1] + f * (t[hi][1] - t[lo][1]);
  };

  // --- API MPMS 11.1 (2004) petróleo crudo, Tabla 6A/24A procedure: CTL desde API@60 y T ---
  const K0 = 341.0957, D60 = 0.01374979547, T60 = 60.0068749;
  E.CTL = function (api60, tF) {
    if (!(api60 >= 0 && api60 <= 100)) throw new Error('API ' + api60 + ' fuera de rango de la Tabla 6A (0–100 °API)');
    if (!(tF >= -58 && tF <= 302)) throw new Error('Temperatura ' + tF + ' °F fuera de rango (−58 a 302 °F)');
    const rho = 141.5 * 999.016 / (api60 + 131.5);                 // kg/m3 a 60 °F
    const A = (D60 / 2) * (K0 / (rho * rho));
    const rho60 = rho * (1 + (Math.exp(A * (1 + 0.8 * A)) - 1) / (1 + A * (1 + 1.6 * A) * 2));
    const a60 = K0 / (rho60 * rho60);                               // coef. expansión térmica 1/°F
    const t90 = (tF - 32) / 1.8, x = t90 / 630;                    // ITS-90 -> IPTS-68
    const poly = (-0.148759 + (-0.267408 + (1.08076 + (1.269056 + (-4.089591 + (-1.871251 + (7.438081 - 3.536296 * x) * x) * x) * x) * x) * x) * x) * x;
    const t68F = 1.8 * (t90 - poly) + 32;
    const dT = t68F - T60;
    const vcf = Math.exp(-a60 * dT * (1 + 0.8 * a60 * (dT + D60)));
    return R(vcf, 5);                                              // 5 decimales
  };

  // --- API MPMS 12.1.1: CTSh = 1 + 2αΔT + α²ΔT², 5 decimales ---
  E.CTSh = function (alpha, tShell, tBase) {
    const d = tShell - tBase;
    return R(1 + 2 * alpha * d + alpha * alpha * d * d, 5);
  };
  // Temperatura de pared: aislado o sin dato ambiente = TL; no aislado = (7TL+Ta)/8 (12.1.1 §?)
  E.shellTemp = function (tl, ta) {
    if (ta === null || ta === '' || isNaN(ta)) return tl;
    return (7 * tl + Number(ta)) / 8;
  };

  // --- Un movimiento (apertura o cierre) ---
  // in: {levelMm, fwlMm, tempF, api60, bsw, ambF, fra}
  // tank: {table, waterTable?, alpha, tBase, refHeightTable}
  E.measure = function (tank, p) {
    const tov = R(E.tov(tank.table, p.levelMm), 2);
    let fwv = 0;
    if (p.fwlMm > 0) fwv = R(E.tov(tank.waterTable || tank.table, p.fwlMm), 2);
    if (fwv > tov) throw new Error('El agua libre excede el TOV');
    const fra = Number(p.fra || 0);
    const tsh = E.shellTemp(p.tempF, p.ambF);
    const ctsh = E.CTSh(tank.alpha ?? 6.2e-6, Math.round(tsh), tank.tBase ?? 60);   // Excel: ROUND(Tsh,0)
    const gov = R((tov - fwv) * ctsh + fra, 2);
    const ctl = E.CTL(p.api60, p.tempF);
    const gsv = R(((tov - fwv) * ctsh + fra) * ctl, 2);
    const csw = R((100 - p.bsw) / 100, 5);
    const nsv = R(((tov - fwv) * ctsh + fra) * ctl * csw, 2);
    return { levelMm: p.levelMm, tov, fwv, ctsh, gov, ctl, gsv, csw, nsv, tempF: p.tempF, api60: p.api60, bsw: p.bsw };
  };

  // --- Volumen transferido, tanques de arrendamiento (API MPMS 12.1.1, §15.2.1) ---
  // ΔTOV, ΔFWV, ΔGOV, ΔGSV = |apertura − cierre| (2 decimales).
  // NSV transferido = ΔGSV × CSW (NO la resta de NSV de apertura y cierre), CSW = (100 − %S&W)/100 a 5 decimales.
  // %S&W del despacho: 'open' (apertura, por defecto), 'close' (cierre) o 'avg' (promedio).
  E.dispatch = function (o, c, opts) {
    const mode = (opts && opts.bswMode) || 'open';
    const bsw = mode === 'close' ? c.bsw : mode === 'avg' ? R((o.bsw + c.bsw) / 2, 4) : o.bsw;
    const d = (k) => R(Math.abs(o[k] - c[k]), 2);
    const gsv = d('gsv');
    const csw = R((100 - bsw) / 100, 5);
    return { tov: d('tov'), fwv: R(Math.abs(o.fwv - c.fwv), 2), gov: d('gov'), gsv, csw, bswUsed: bsw, nsv: R(gsv * csw, 2),
             nsvDiff: d('nsv') /* solo referencia: |NSV apertura − NSV cierre| */ };
  };

  // --- Prorrateo a carrotanques (hoja Ctks_Prorrateo) ---
  // veh: [{id, vol, maxGov}]; D: totales despacho; ctl/bsw efectivos del despacho
  // 1) fracción = vol/Σvol (6 decimales)  2) GOV_i = GOV·f  3) GSV_i = GOV_i·CTL  4) NSV_i = GSV_i·(1−BSW/100)
  // 5) "ajuste a cero": diferencia total repartida por fracción y cierre exacto en centésimas.
  E.prorate = function (D, veh) {
    const act = veh.filter((v) => v.vol > 0);
    const sumVol = act.reduce((s, v) => s + Number(v.vol), 0);
    if (!act.length || sumVol <= 0) throw new Error('No hay volúmenes programados para prorratear');
    const ctlEff = D.gov > 0 ? D.gsv / D.gov : 0;
    const bswEff = D.gsv > 0 ? (1 - D.nsv / D.gsv) * 100 : 0;
    const rows = act.map((v) => {
      const f = R(Number(v.vol) / sumVol, 6);
      const gov = D.gov * f, gsv = gov * ctlEff, nsv = gsv * (1 - bswEff / 100);
      return { id: v.id, vol: Number(v.vol), maxGov: v.maxGov, f, govP: gov, gsvP: gsv, nsvP: nsv };
    });
    const sf = rows.reduce((s, r) => s + r.f, 0);
    const diff = { gov: D.gov - rows.reduce((s, r) => s + r.govP, 0), gsv: D.gsv - rows.reduce((s, r) => s + r.gsvP, 0), nsv: D.nsv - rows.reduce((s, r) => s + r.nsvP, 0) };
    // ajuste: reparte la diferencia proporcional a la fracción, redondea a 0.01 y cierra residuo en el mayor
    ['gov', 'gsv', 'nsv'].forEach((k) => {
      const P = k + 'P', A = k + 'A';
      rows.forEach((r) => { r[A] = R(r[P] + diff[k] * (r.f / sf), 2); });
      const target = cents(D[k]);
      let resid = target - rows.reduce((s, r) => s + cents(r[A]), 0);
      if (resid !== 0) {
        const big = rows.reduce((m, r) => (r.vol > m.vol ? r : m), rows[0]);
        big[A] = (cents(big[A]) + resid) / 100;
      }
    });
    rows.forEach((r) => { r.bswA = r.gsvA ? R((r.gsvA - r.nsvA) / r.gsvA * 100, 4) : 0; r.overMax = r.maxGov ? r.govA > r.maxGov : false; });
    const sums = {};
    ['gov', 'gsv', 'nsv'].forEach((k) => {
      sums[k] = { prorrateo: R(rows.reduce((s, r) => s + r[k + 'P'], 0), 4), ajustado: rows.reduce((s, r) => s + cents(r[k + 'A']), 0) / 100, total: D[k] };
      sums[k].ok = cents(sums[k].ajustado) === cents(sums[k].total);
      sums[k].diffPre = R(sums[k].total - sums[k].prorrateo, 4);
    });
    return { rows, sums, sumVol, ctlEff, bswEff, ok: sums.gov.ok && sums.gsv.ok && sums.nsv.ok };
  };

  if (typeof module !== 'undefined') module.exports = E; else root.OilEngine = E;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

const num=s=>{if(s===null||s===undefined)return NaN;s=String(s).trim().replace(/\s/g,'');if(s==='')return NaN;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)};
const slug=s=>String(s).trim().replace(/[^A-Za-z0-9_-]+/g,'_').slice(0,80)||'x';

/* ---------- Biblioteca de aforo: codec ---------- */
const encT=rows=>rows.map(r=>r[0]+','+r[1]).join(';');
const decT=s=>s?s.split(';').map(p=>{const q=p.split(',');return [Number(q[0]),Number(q[1])]}):[];

/* ---------- Almacenamiento: db compartida si existe, si no navegador ---------- */
const COLS=['tanks','tabs','products','vehicles','ops','audit'];

function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)COLS.forEach(c=>S.cache[c]=j[c]||{})}catch(e){}}
async function initStore(){
  try{S.db=window.claude?.use?await claude.use('db'):null;S.user=window.claude?.use?await claude.use('user'):null}catch(e){}

async function del(col,id){delete S.cache[col][id];if(S.db){try{await S.db.doc(col+'/'+id).delete()}catch(e){toast('No se pudo eliminar: '+(e.message||e.code),'bad')}}else lsSave()}
function getTank(id){if(id==='DEMO')return DEMO;const t=S.cache.tanks[id];if(!t)return null;
  if(!t._table){const parts=Object.keys(S.cache.tabs).filter(k=>k.startsWith(slug(id)+'__')).sort((a,b)=>Number(a.split('__')[1])-Number(b.split('__')[1]));
    t._table=decT(parts.map(k=>S.cache.tabs[k].s).join(';'))}
  return Object.assign({},t,{table:t._table})}
async function saveTank(t,rows){const id=slug(t.id||t.name);t.id=id;
  const old=Object.keys(S.cache.tabs).filter(k=>k.startsWith(id+'__'));for(const k of old)await del('tabs',k);
  const s=encT(rows),CH=60000;let n=0;for(let i=0;i<s.length;i+=CH){let end=Math.min(s.length,i+CH);if(end<s.length){end=s.lastIndexOf(';',end)}
    const piece=s.slice(i,end);await put('tabs',id+'__'+String(n++).padStart(3,'0'),{s:piece});i=end+1-CH}
  const meta=Object.assign({},t);delete meta._table;meta.rows=rows.length;meta.minMm=rows[0][0];meta.maxMm=rows[rows.length-1][0];
  await put('tanks',id,meta);S.cache.tanks[id]._table=rows;return id}

/* ---------- Auditoría con cadena de hash ---------- */
const auditList=()=>Object.entries(S.cache.audit).map(([id,r])=>({id,...r})).sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:a.id<b.id?-1:1);
async function audit(action,entity,detail){
  const l=auditList(),prev=l.length?l[l.length-1].hash:'GENESIS';
  const rec={ts:new Date().toISOString(),user:S.me.name,uid:S.me.id,action,entity:String(entity||''),detail:String(detail||'').slice(0,600),prev};
  rec.hash=await sha256([prev,rec.ts,rec.uid,rec.action,rec.entity,rec.detail].join('|'));
  await put('audit',rec.ts.replace(/[:.]/g,'')+'-'+Math.random().toString(36).slice(2,6),rec)}
async function verifyChain(){const l=auditList();let prev='GENESIS',bad=[];
  for(const r of l){const h=await sha256([r.prev,r.ts,r.uid,r.action,r.entity,r.detail].join('|'));if(r.prev!==prev||h!==r.hash)bad.push(r);prev=r.hash}
  return {n:l.length,bad}}

function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++){c=c[k[i]]}c[k[k.length-1]]=v}
function getPath(o,p){return p.split('.').reduce((c,k)=>c?.[k],o)}

function readSide(s,name){const o={};
  o.levelMm=E.levelFromReadings(s.lv.map(num));o.tempF=E.tempFromReadings(s.tv.map(num));o.fwlMm=num(s.fwl)||0;o.api60=num(s.api);o.bsw=num(s.bsw);o.ambF=num(s.amb);o.fra=num(cur.fra)||0;o.ref=num(s.ref);return o}
function recalc(){
  const warns=[],errs=[];calc={};const tank=getTank(cur.tankId);
  const sides={open:readSide(cur.open),close:readSide(cur.close)};
  if(cur.sameQ){sides.close.api60=sides.open.api60;sides.close.bsw=sides.open.bsw}
  ['open','close'].forEach(k=>{const s=sides[k];$('#d-'+k+'-lv').innerHTML=isNaN(s.levelMm)?'Nivel adoptado: —':`Nivel adoptado (API 3): <b>${s.levelMm} mm</b>`;
    $('#d-'+k+'-tv').innerHTML=isNaN(s.tempF)?'Temperatura promedio: —':`Temperatura promedio: <b>${fmt(s.tempF,1)} °F</b>`});
  ['open','close'].forEach(k=>{const lv=cur[k].lv.map(num);if(!isNaN(lv[0])&&!isNaN(lv[1])&&lv[0]!==lv[1]&&isNaN(lv[2]))warns.push((k==='open'?'Apertura':'Cierre')+`: las lecturas de nivel 1 (${lv[0]} mm) y 2 (${lv[1]} mm) difieren. Registre una tercera lectura; mientras tanto se usa el promedio (API MPMS 3).`)});
  let o=null,c=null;
  if(!tank)errs.push('Elija un tanque con tabla de aforo en la biblioteca.');
  else{
    const T={table:tank.table,alpha:tank.alpha,tBase:tank.tBase};
    ['open','close'].forEach(k=>{const s=sides[k],lab=k==='open'?'Apertura':'Cierre';
      if(isNaN(s.levelMm)||isNaN(s.tempF)||isNaN(s.api60)||isNaN(s.bsw)){errs.push(lab+': complete nivel, temperatura, API y %BSW.');return}
      if(s.bsw<0||s.bsw>100)errs.push(lab+': %BSW debe estar entre 0 y 100.');
      if(!isNaN(s.ref)&&tank.refHeight&&Math.abs(s.ref-tank.refHeight)>(tank.refTol??2))warns.push(`${lab}: altura de referencia observada (${s.ref} mm) difiere de la de la tabla (${tank.refHeight} mm) en más de ${tank.refTol??2} mm. Revise la medición (API MPMS 3.1A).`);
      if(s.fwlMm>0&&s.fwlMm>=s.levelMm)errs.push(lab+': el nivel de agua libre no puede superar el nivel de producto.');
      try{const r=E.measure(T,s);if(k==='open')o=r;else c=r}catch(e){errs.push(lab+': '+e.message)}});
  }
  if(o&&c){if(c.levelMm>o.levelMm)warns.push('El nivel de cierre es mayor que el de apertura: no corresponde a un despacho. Revise los datos.');
    const D=E.dispatch(o,c,{bswMode:cur.bswMode||'open'});calc={o,c,D};
    if(sides.open.tempF>230||sides.open.tempF<30)warns.push('Temperatura fuera del rango habitual de operación; verifique el termómetro.');
  }
  // Tabla de resultados
  const rows=[['TOV · Volumen total observado','tov',2],['Agua libre FWV','fwv',2],['CTSh · Corrección por temperatura de lámina','ctsh',5],['GOV · Volumen bruto observado','gov',2],['CTL · Corrección por temperatura del líquido','ctl',5],['GSV · Volumen bruto estándar','gsv',2],['CSW · Factor por agua y sedimento','csw',5],['NSV · Volumen neto estándar','nsv',2]];
  const D=calc.D;
  $('#resT').innerHTML=`<table><thead><tr><th class="t">Concepto</th><th>Apertura</th><th>Cierre</th><th>Despacho (bbl)</th></tr></thead><tbody>`+
   rows.map(([l,k,d])=>{const dv=D&&D[k]!==undefined?fmt(D[k],d):(k==='ctl'&&D&&D.gov?fmt(D.gsv/D.gov,5):'');
     return `<tr><td class="t">${l}</td><td class="mono">${o?fmt(o[k],d):'—'}</td><td class="mono">${c?fmt(c[k],d):'—'}</td><td class="mono key">${dv===''?'':dv}</td></tr>`}).join('')+
   `<tr><td class="t">Nivel adoptado (mm) · T (°F) · API · BSW (%)</td><td class="mono">${o?`${o.levelMm} · ${fmt(o.tempF,1)} · ${fmt(o.api60,1)} · ${fmt(o.bsw,3)}`:'—'}</td><td class="mono">${c?`${c.levelMm} · ${fmt(c.tempF,1)} · ${fmt(c.api60,1)} · ${fmt(c.bsw,3)}`:'—'}</td><td></td></tr></tbody></table>`;
  $('#resN').innerHTML=D?`Despacho según API MPMS 12.1.1 §15.2.1 (tanques de arrendamiento): GOV, GSV = |apertura − cierre|; <b>NSV = ΔGSV × CSW</b> = ${fmt(D.gsv)} × ${fmt(D.csw,5)} (BSW ${fmt(D.bswUsed,3)} %). Referencia: NSV apertura − NSV cierre = ${fmt(D.nsvDiff)} bbl.`:'';
  // Vehículos
  let pr=null;const vehs=cur.veh.map((v,i)=>({id:v.key||('#'+(i+1)),vol:num(v.vol)||0,maxGov:0}));
  if(D&&D.gov>0&&vehs.some(v=>v.vol>0)){try{pr=E.prorate(D,vehs)}catch(e){errs.push(e.message)}}
  calc.pr=pr;
  cur.veh.forEach((v,i)=>{const r=pr&&pr.rows.find(x=>x.id===(v.key||('#'+(i+1))));const set=(id,h)=>{const e=$('#'+id+i);if(e)e.innerHTML=h};
    set('vf',r?fmt(r.f,6):'');set('vg',r?fmt(r.govA):'');set('vs',r?fmt(r.gsvA):'');set('vn',r?fmt(r.nsvA):'');set('vb',r?fmt(r.bswA,3):'');
    const ch=[];if(r){if(r.over)ch.push(`<span class="chip bad" title="El GOV prorrateado (${fmt(r.govA)} bbl) supera el volumen programado (${fmt(r.vol)} bbl)">Posible sobrellenado</span>`);
      if(!ch.length)ch.push('<span class="chip ok">OK</span>')}
    set('ve',ch.join(' '))});
  $('#vfoot').innerHTML=pr?`<tr class="tot"><td></td><td class="t">Σ ${pr.rows.length} vehículos</td><td class="mono">${fmt(pr.sumVol)}</td><td class="mono">${fmt(pr.rows.reduce((s,r)=>s+r.f,0),6)}</td><td class="mono">${fmt(pr.sums.gov.ajustado)}</td><td class="mono">${fmt(pr.sums.gsv.ajustado)}</td><td class="mono">${fmt(pr.sums.nsv.ajustado)}</td><td></td><td></td><td></td></tr>`:'';
  // Chequeos
  const al=[];
  if(pr){const nm={gov:'GOV',gsv:'GSV',nsv:'NSV'};
    const tolP=isNaN(num(cur.tol))?0.5:Math.max(0,num(cur.tol));
    // 1) cada vehículo: programado >= GOV prorrateado (holgura 0,05 bbl por redondeo)
    pr.rows.forEach(r=>{r.over=r.govA-r.vol>0.05});
    const sob=pr.rows.filter(r=>r.over);
    // 2) bache: Σ programado vs GOV del despacho
    const gap=R(pr.sumVol-D.gov,2),gapPct=D.gov?gap/D.gov*100:0,avg=pr.sumVol/pr.rows.length;
    const cov=Math.abs(gapPct)<=tolP?'ok':(gap<0?'falta':'sobra');
    const nVeh=Math.max(1,Math.ceil(Math.abs(gap)/avg));
    $('#checks').innerHTML=['gov','gsv','nsv'].map(k=>{const s=pr.sums[k];return `<div class="ck ${s.ok?'ok':'bad'}"><span class="k">Σ ${nm[k]} vehículos</span><span class="v">${fmt(s.ajustado)}</span><span class="d">Despacho ${fmt(s.total)} · diferencia ${fmt(s.ajustado-s.total)} bbl · prorrateo directo ${fmt(s.prorrateo,4)} (dif. ${fmt(s.diffPre,4)})</span><span class="s">${s.ok?'✓ Cuadra':'✗ No cuadra'}</span></div>`}).join('')+
     `<div class="ck ${cov==='ok'?'ok':'bad'}"><span class="k">Programado vs bache</span><span class="v">${fmt(pr.sumVol)}</span><span class="d">GOV del despacho ${fmt(D.gov)} · diferencia ${fmt(gap)} bbl (${fmt(gapPct,2)} %) · tolerancia ${fmt(tolP,2)} %</span><span class="s">${cov==='ok'?'✓ El programa cubre el bache':cov==='falta'?'✗ Faltan vehículos':'✗ Sobran vehículos'}</span></div>`+
     `<div class="ck ${sob.length?'bad':'ok'}"><span class="k">Programado ≥ GOV prorrateado</span><span class="v">${pr.rows.length-sob.length} de ${pr.rows.length}</span><span class="d">Cada vehículo debe tener programado igual o mayor que el GOV que le corresponde</span><span class="s">${sob.length?'✗ '+sob.length+' con posible sobrellenado':'✓ Todos en orden'}</span></div>`;
    if(sob.length)al.push({k:'bad',t:`Posible sobrellenado o sobrepeso: el GOV prorrateado supera el volumen programado en ${sob.map(r=>`${r.id} (+${fmt(r.govA-r.vol)} bbl)`).join(', ')}. Revise el programa o el volumen real cargado.`});
    if(cov==='falta')al.push({k:'bad',t:`Faltan vehículos programados para completar el bache: el volumen programado (${fmt(pr.sumVol)} bbl) es ${fmt(-gap)} bbl menor que el GOV despachado (${fmt(D.gov)} bbl). Equivale a ${nVeh} carrotanque${nVeh>1?'s':''} más del tamaño promedio programado. Agregue los vehículos faltantes o revise las medidas del tanque.`});
    if(cov==='sobra')al.push({k:'bad',t:`Hay carrotanques de más para este bache: el volumen programado (${fmt(pr.sumVol)} bbl) supera en ${fmt(gap)} bbl el GOV despachado (${fmt(D.gov)} bbl). Equivale a ${nVeh} carrotanque${nVeh>1?'s':''} del tamaño promedio programado. Retire vehículos o revise las medidas del tanque.`});
    const ids=cur.veh.map(v=>v.key).filter(Boolean);if(new Set(ids).size!==ids.length)al.push({k:'warn',t:'Hay binomios repetidos en el bache.'});
    calc.alerts=al.map(a=>a.t);calc.cov=cov;
    // refrescar estado por vehículo con la bandera de sobrellenado ya calculada
    cur.veh.forEach((v,i)=>{const r=pr.rows.find(x=>x.id===(v.key||('#'+(i+1))));const e=$('#ve'+i);if(!e||!r)return;const ch=[];
      if(r.over)ch.push(`<span class="chip bad" title="GOV prorrateado ${fmt(r.govA)} bbl > programado ${fmt(r.vol)} bbl">Posible sobrellenado</span>`);
      if(!ch.length)ch.push('<span class="chip ok">OK</span>');e.innerHTML=ch.join(' ')});
  }else $('#checks').innerHTML='<div class="msg info">Complete el cálculo del tanque y los volúmenes programados para chequear la suma.</div>';
  $('#msgs').innerHTML=errs.map(e=>`<div class="msg bad">${esc(e)}</div>`).join('')+warns.map(w=>`<div class="msg warn">${esc(w)}</div>`).join('');
  $('#alerts').innerHTML=al.map(a=>`<div class="msg ${a.k}">${esc(a.t)}</div>`).join('');
}

/* ---------- Eventos del Despacho ---------- */
async function saveOp(){
  if(!calc.D||!calc.pr)return toast('Complete el cálculo antes de guardar.','warn');
  if(!cur.orden.trim())return toast('Ingrese el número de orden.','warn');
  if(!calc.pr.ok)return toast('La suma de carrotanques no cuadra con el despacho. Revise antes de guardar.','bad');
  if(calc.alerts?.length&&!confirmAl){confirmAl=true;return toast('Hay alertas en el bache ('+calc.alerts.length+'). Revíselas; pulse Guardar de nuevo para guardar con las alertas registradas.','warn')}
  const tank=getTank(cur.tankId);if(cur.tankId==='DEMO'&&!confirmDemo)return toast('Está usando el tanque de ejemplo. Pulse Guardar de nuevo para confirmar.','warn',confirmDemo=true);
  if(!cur.id)cur.id=slug(cur.orden)+'-'+cur.fecha;cur.rev=(cur.rev||0)+1;delete cur.demo;
  const rec={id:cur.id,rev:cur.rev,savedAt:new Date().toISOString(),by:S.me.name,status:'vigente',inputs:JSON.parse(JSON.stringify(cur)),tank:tank?.name,
    totals:calc.D,alerts:calc.alerts||[],open:calc.o,close:calc.c,vehicles:calc.pr.rows.map(r=>({id:r.id,vol:r.vol,f:r.f,gov:r.govA,gsv:r.gsvA,nsv:r.nsvA,bsw:r.bswA}))};
  rec.hash=await sha256(JSON.stringify(rec.inputs)+JSON.stringify(rec.totals));
  await put('ops',cur.id,rec);
  for(const v of cur.veh){const key=(v.key||'').trim().toUpperCase();const vol=num(v.vol);if(!key||!vol)continue;
    const s=slug(key);const ex=S.cache.vehicles[s]||{key,cab:key.split('/')[0],rem:key.split('/')[1]||'',maxGov:num(v.max)||0,loads:[]};
    ex.loads=[...(ex.loads||[]),{ts:cur.fecha,vol,op:cur.id}].slice(-20);if(num(v.max))ex.maxGov=num(v.max);await put('vehicles',s,ex)}
  await audit('GUARDAR_OPERACION',cur.id,`rev ${cur.rev} · ${tank?.name} · GOV ${calc.D.gov} GSV ${calc.D.gsv} NSV ${calc.D.nsv} · alertas ${rec.alerts.length} · sha ${rec.hash.slice(0,16)}`);
  toast('Operación guardada: '+cur.id+' (rev '+cur.rev+').','ok');viewDespacho()}
let confirmDemo=false,confirmAl=false;
function meanLoad(k,n=5){const v=S.cache.vehicles[slug(k.toUpperCase())]||DEMO_VEH.find(x=>x.key===k);if(!v||!v.loads?.length)return null;const l=v.loads.slice(-n);return {mean:R(l.reduce((s,x)=>s+x.vol,0)/l.length,2),max:v.maxGov,n:l.length}}
document.addEventListener('input',e=>{const t=e.target;if(tab!=='despacho')return;
  if(t.dataset.k){setPath(cur,t.dataset.k,t.value);if(t.dataset.k==='tankId'){const tk=getTank(t.value);if(tk&&!cur.product)cur.product=tk.product||'';if(tk&&tk.product&&!cur.open.api){const p=Object.values(S.cache.products).find(p=>p.name===tk.product);}}
    if(t.dataset.k==='product'){const p=Object.values(S.cache.products).find(p=>p.name===t.value);if(p){if(p.api&&!cur.open.api)cur.open.api=String(p.api);if(p.bsw&&!cur.open.bsw)cur.open.bsw=String(p.bsw);syncSame();$$('[data-k="open.api"],[data-k="open.bsw"],[data-k="close.api"],[data-k="close.bsw"]').forEach(i=>i.value=getPath(cur,i.dataset.k))}}
    if(t.dataset.k.startsWith('open.')&&cur.sameQ)syncSame(true);recalc()}
  if(t.dataset.vk){const i=Number(t.closest('tr').dataset.i);cur.veh[i][t.dataset.vk]=t.value;recalc()}});

/* ---------- Lectura de archivos / texto tabular ---------- */
function parseTable(txt){const lines=String(txt).split(/\r?\n/).filter(l=>l.trim()!=='');if(!lines.length)return[];
  const d=[['\t',0],[';',0],[',',0]].map(x=>[x[0],(lines[0].split(x[0]).length)]).sort((a,b)=>b[1]-a[1])[0][0];
  return lines.map(l=>l.split(d).map(c=>c.trim().replace(/^"|"$/g,'')))}
async function readFile(f){const name=f.name.toLowerCase();
  if(/\.(xlsx|xlsm|xls)$/.test(name)){if(!window.XLSX)throw new Error('La librería de Excel no cargó; use CSV.');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const o={};wb.SheetNames.forEach(n=>{o[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})});return o}
  if(name.endsWith('.json')){return {json:JSON.parse(await f.text())}}
  return {csv:parseTable(await f.text())}}
function vehFromRows(rows){const out=[];if(!rows.length)return out;const h=rows[0].map(x=>String(x).toLowerCase());
  const hasH=h.some(x=>/placa|cabez|remolq|binomio|vol/.test(x));let ic=-1,ir=-1,iv=-1,im=-1;
  if(hasH){h.forEach((x,i)=>{if(/cabez|tracto/.test(x))ic=i;else if(/remolq|trailer/.test(x))ir=i;else if(/placa|binomio/.test(x)&&ic<0)ic=i;else if(/m[aá]x/.test(x))im=i;else if(/vol/.test(x)&&iv<0)iv=i})}
  else{ic=0;iv=rows[0].length>2&&isNaN(num(rows[0][1]))?2:1;if(rows[0].length>=4){ic=0;ir=1;iv=2;im=3}else if(rows[0].length===3){im=2}}
  if(iv<0)return out;
  rows.slice(hasH?1:0).forEach(r=>{const cab=String(r[ic]??'').trim().toUpperCase();const rem=ir>=0?String(r[ir]??'').trim().toUpperCase():'';const vol=num(r[iv]);if(!cab||isNaN(vol))return;
    out.push({key:rem?cab+'/'+rem:cab,cab,rem,vol,max:NaN})});return out}

document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||tab!=='datos')return;
  if(t.id==='tplDl'){if(!window.XLSX)return saveFile('plantilla_operacion.csv',new Blob([templateRows().map(r=>r.join(';')).join('\n')],{type:'text/csv'}));

    const fn=stamp()+'.csv';audit('EXPORTAR_REPORTE',fn,'csv carrotanques · orden '+cur.orden);saveFile(fn,new Blob([[h,...calc.pr.rows.map(r=>[r.id,r.vol,r.f,r.govA,r.gsvA,r.nsvA,r.bswA].join(';'))].join('\n')],{type:'text/csv'}))}

    const fn=stamp()+'.xlsx';const res=[['Código de reporte',fn.replace('.xlsx','')],['Orden',cur.orden],['%BSW aplicado al despacho',D.bswUsed],['Fecha',cur.fecha],['Tanque',getTank(cur.tankId)?.name],['Producto',cur.product],['Usuario',S.me.name],[],['Concepto','Apertura','Cierre','Despacho'],
      ...[['TOV','tov'],['FWV','fwv'],['CTSh','ctsh'],['GOV','gov'],['CTL','ctl'],['GSV','gsv'],['CSW','csw'],['NSV','nsv']].map(([l,k])=>[l,o[k],c[k],D[k]??'']),['Nivel mm',o.levelMm,c.levelMm],['Temp °F',o.tempF,c.tempF],['API 60F',o.api60,c.api60],['BSW %',o.bsw,c.bsw]];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),'Resumen');
    if(calc.pr){const p=calc.pr;const v=[['Binomio','Vol. programado','Fracción','GOV prorrateo','GSV prorrateo','NSV prorrateo','GOV ajustado','GSV ajustado','NSV ajustado','%BSW'],...p.rows.map(r=>[r.id,r.vol,r.f,r.govP,r.gsvP,r.nsvP,r.govA,r.gsvA,r.nsvA,r.bswA]),
      ['Σ',p.sumVol,'','','','',p.sums.gov.ajustado,p.sums.gsv.ajustado,p.sums.nsv.ajustado],['Total despacho','','','','','',D.gov,D.gsv,D.nsv],['Cuadra',p.ok?'SÍ':'NO']];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(v),'Carrotanques')}
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(templateRows()),'Entradas');
    audit('EXPORTAR_REPORTE',fn,'xlsx · orden '+cur.orden+' · GOV '+D.gov+' GSV '+D.gsv+' NSV '+D.nsv);saveFile(fn,new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'}))}});

/* ---------- Historial ---------- */
function viewHistorial(){const l=Object.values(S.cache.ops).sort((a,b)=>a.savedAt<b.savedAt?1:-1);
  $('#app').innerHTML=`<div id="toasts" class="msgs"></div><section class="card"><h2>Operaciones guardadas</h2><div class="tw"><table><thead><tr><th class="t">Operación</th><th class="t">Tanque</th><th class="t">Producto</th><th>GOV</th><th>GSV</th><th>NSV</th><th>Vehículos</th><th>Rev.</th><th class="t">Estado</th><th class="t">Usuario</th><th></th></tr></thead><tbody>
  ${l.length?l.map(o=>`<tr><td class="t">${esc(o.id)}</td><td class="t">${esc(o.tank||'')}</td><td class="t">${esc(o.inputs?.product||'')}</td><td class="mono">${fmt(o.totals.gov)}</td><td class="mono">${fmt(o.totals.gsv)}</td><td class="mono">${fmt(o.totals.nsv)}</td><td class="mono">${o.vehicles.length}</td><td class="mono">${o.rev}</td><td class="t"><span class="chip ${o.status==='vigente'?'ok':'bad'}">${o.status}</span></td><td class="t">${esc(o.by)}</td><td class="t"><button class="b s" data-oopen="${esc(o.id)}">Abrir</button> ${o.status==='vigente'?`<button class="b s" data-ovoid="${esc(o.id)}">Anular</button>`:''}</td></tr>`).join(''):'<tr><td class="t" colspan="11">Aún no hay operaciones guardadas. Complete un despacho y pulse “Guardar operación”.</td></tr>'}</tbody></table></div>
  <div class="note">Las operaciones no se borran: se anulan, y cada cambio queda en la auditoría.</div></section>`}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||tab!=='historial')return;
  if(t.dataset.oopen){const o=S.cache.ops[t.dataset.oopen];cur=Object.assign(newOp(),JSON.parse(JSON.stringify(o.inputs)));cur.rev=o.rev;await audit('ABRIR_OPERACION',o.id,'rev '+o.rev);go('despacho')}
  if(t.dataset.ovoid){const o=S.cache.ops[t.dataset.ovoid];o.status='anulada';await put('ops',o.id,o);await audit('ANULAR_OPERACION',o.id,'rev '+o.rev);viewHistorial()}});

/* ---------- Auditoría ---------- */
async function viewAudit(){const l=auditList().reverse().slice(0,300);
  $('#app').innerHTML=`<div id="toasts" class="msgs"></div><section class="card"><div class="row"><h2 style="margin-right:auto">Registro de auditoría</h2><button class="b" id="aVer">Verificar cadena</button><button class="b" id="aCsv">Exportar CSV</button></div><div id="aRes"></div>
  <div class="tw"><table><thead><tr><th class="t">Fecha (UTC)</th><th class="t">Usuario</th><th class="t">Acción</th><th class="t">Entidad</th><th class="t">Detalle</th><th class="t">Hash</th></tr></thead><tbody>
  ${l.length?l.map(r=>`<tr><td class="t mono">${r.ts.replace('T',' ').slice(0,19)}</td><td class="t">${esc(r.user)}</td><td class="t">${esc(r.action)}</td><td class="t">${esc(r.entity)}</td><td class="t" style="white-space:normal;min-width:240px">${esc(r.detail)}</td><td class="t mono">${r.hash.slice(0,10)}</td></tr>`).join(''):'<tr><td class="t" colspan="6">Sin registros todavía. Cada guardado, importación o cambio de biblioteca queda aquí.</td></tr>'}</tbody></table></div>
  <div class="note">Cada registro incluye el hash del anterior (SHA-256). Si alguien altera o borra un registro, “Verificar cadena” lo detecta. Se muestran los últimos 300.</div></section>`}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||tab!=='audit')return;
  if(t.id==='aVer'){const r=await verifyChain();$('#aRes').innerHTML=r.bad.length?`<div class="msg bad">Se detectaron ${r.bad.length} registros inconsistentes de ${r.n}. Primero: ${esc(r.bad[0].ts)} · ${esc(r.bad[0].action)}</div>`:`<div class="msg ok">Cadena íntegra: ${r.n} registros verificados.</div>`}
  if(t.id==='aCsv')saveFile('auditoria.csv',new Blob([['fecha;usuario;accion;entidad;detalle;hash',...auditList().map(r=>[r.ts,r.user,r.action,r.entity,String(r.detail).replace(/;/g,','),r.hash].join(';'))].join('\n')],{type:'text/csv'}))});

/* ---------- Guía ---------- */
function viewGuia(){$('#app').innerHTML=`<section class="card guide"><h2>Guía de operación</h2>
 <h3>Flujo normal</h3><ol><li>En <b>Tanques y aforo</b> cargue la tabla del tanque (nivel en mm, volumen en bbl, m³ o galones) una sola vez.</li><li>En <b>Despacho</b> elija tanque y producto. Ingrese dos lecturas de nivel (una tercera solo si las dos primeras difieren) y tres lecturas de temperatura, de apertura y de cierre, el nivel de agua libre, la gravedad API a 60 °F y el %BSW.</li><li>Agregue los binomios del bache con su volumen programado, que es el máximo a cargar en ese vehículo. Puede pegar desde Excel o importar un archivo. Al elegir un binomio conocido se propone la media de sus últimos 5 cargues.</li><li>Revise el chequeo: las tres sumas (GOV, GSV, NSV) deben cuadrar con el despacho. Guarde la operación y exporte el reporte.</li></ol>
 <h3>Secuencia de cálculo</h3><div class="formula">Nivel adoptado (API MPMS 3): 1.ª = 2.ª → 1.ª; 2.ª = 3.ª → 2.ª; si no, promedio. Entero en mm.
TOV  = aforo(nivel)                         2 decimales (interpolación lineal entre puntos)
GOV  = (TOV − FWV) · CTSh + FRA             2 decimales
CTSh = 1 + 2·α·(Tsh−Tbase) + α²·(Tsh−Tbase)²   5 decimales (API 12.1.1)
CTL  = Tabla 6A/24A (API 11.1-2004, crudo)  5 decimales
GSV  = GOV · CTL                            2 decimales
NSV  = GSV · (1 − %BSW/100)                 2 decimales
Despacho (API 12.1.1 §15.2.1, tanques de arrendamiento):
  ΔTOV, ΔGOV, ΔGSV = |apertura − cierre|
  CSW = (100 − %BSW)/100 (5 dec.)  con el %BSW de apertura, cierre o promedio (a elección)
  NSV despacho = ΔGSV · CSW                  (no se resta NSV de apertura y cierre)
Prorrateo: f = vol_i/Σvol (6 dec.); GOV_i = GOV·f; GSV_i = GOV_i·CTL; NSV_i = GSV_i·(1−BSW);
           diferencia total repartida por f y cierre exacto en centésimas ("ajuste a cero").</div>
 <h3>Seguridad y alcance</h3><ul><li>El módulo de autenticación con segundo factor (TOTP) estará disponible para la versión privada.</li><li>Los datos compartidos viven en la base del artefacto solo cuando el visor la concede. Si el chip “Datos” dice <i>navegador</i>, lo guardado queda solo en este equipo.</li><li>Cálculo de CTL para petróleo crudo (Tabla 6A/24A). Para refinados (6B/24B), lubricantes o densidades observadas a temperatura distinta de 60 °F hace falta ampliar el motor.</li><li>El CTL se evalúa con aritmética de doble precisión y se redondea de forma decimal a 5 cifras; las sumas del bache se concilian en enteros de centésimas de barril.</li><li>Valide el uso comercial contra el procedimiento de su compañía y el contrato; la tolerancia de altura de referencia es configurable por tanque.</li></ul></section>`}
